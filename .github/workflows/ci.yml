name: CI
on:
  push:
    branches: [master]
  pull_request:

# A push that supersedes another cancels the older run: the answer for the old commit is no longer wanted,
# and the runner minutes are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Four independent jobs instead of one long chain, so the wall clock is the slowest stage rather than the
# sum: types and lint (fastest to fix), the unit suite, the production build with the real-browser checks,
# and the Android shell. Nothing here consumes anything the others produce, which is why they can all start
# at once — `android-debug` used to wait for the whole suite to finish for no reason.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # one version in every manifest, or fail before anyone ships a mismatched build
      - run: npm run version:check
      - run: npm run lint
      - run: npm run check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITE_SW=1 registers the service worker on localhost too, so the offline checks can run
      - run: npm run build:web
        env:
          VITE_SW: '1'
      # every shell's frontend has to compile, even though cargo and gradle are separate jobs
      - name: Build the native shells' frontends
        run: |
          npm run build:android
          npm run build:desktop
          test ! -f dist-android/sw.js && test ! -f dist-desktop/sw.js
          grep -q 'isNativePlatform' dist-android/assets/*.js
          ! grep -q 'isNativePlatform' dist-desktop/assets/*.js
      # real-browser end-to-end checks against the production build (Chrome is preinstalled on the runner)
      - name: End-to-end tests
        run: |
          npx vite preview --outDir dist-web --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:4173/
          BASE_URL=http://127.0.0.1:4173/ CHROME_PATH=/usr/bin/google-chrome EXPECT_SW=1 node scripts/e2e.mjs
      # a failed check that leaves a screenshot behind can be diagnosed from the run instead of re-run blind
      - name: Keep the failing screen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore
          retention-days: 3

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: split-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
