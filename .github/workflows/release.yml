name: Release
# Runs when you push a version tag such as v0.2.0. Creates a draft GitHub release with desktop installers and an Android APK.
on:
  push:
    tags: ['v*']
  # lets a release be filled in later (a desktop installer after the tag, say) without moving the tag
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach this run's installers to
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Split ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:android
      - run: npx cap sync android
      # a debug-signed APK cannot be updated in place, so a release without the key is not published
      - name: Check for the release key
        id: key
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No Android key set (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD): skipping the APK rather than publishing one that cannot be updated in place."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the release key
        if: steps.key.outputs.present == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/split-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=split-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build and sign the APK
        if: steps.key.outputs.present == 'true'
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Verify the signature
        if: steps.key.outputs.present == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "Split-${GITHUB_REF_NAME#v}.apk"
      - name: Attach to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --draft --title "Split ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" Split-*.apk --clobber
