<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1115" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Split</title>
  <style>
    #splash{position:fixed;inset:0;z-index:100;background:#0F1115;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .25s}
    #splash.hide{opacity:0;pointer-events:none}
    #splash span{color:#A3ACBA;font:600 15px system-ui,sans-serif;letter-spacing:.3px}
    @media (prefers-reduced-motion:reduce){#splash{transition:none}}
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="./logo.png" width="120" height="120" alt=""><span>Split</span></div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
