# Template for an F-Droid inclusion request (merge request to https://gitlab.com/fdroid/fdroiddata).
# Rename this file to your real application id (it must match applicationId in android/app/build.gradle), replace the
# placeholders, and compare with the current F-Droid documentation and similar Capacitor apps in fdroiddata, because
# build servers and recipes change. This template has NOT been tested against F-Droid's build server.
Categories:
  - Time
  - Games
License: GPL-3.0-or-later
AuthorName: YOUR NAME
SourceCode: https://github.com/YOURNAME/split
IssueTracker: https://github.com/YOURNAME/split/issues
Changelog: https://github.com/YOURNAME/split/blob/HEAD/CHANGELOG.md

AutoName: Split

RepoType: git
Repo: https://github.com/YOURNAME/split.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm   # a recent Node (22+) is required; adjust to what the build server provides
    init: cd ../.. && npm ci
    gradle:
      - yes
    prebuild: cd ../.. && npm run build && npx cap sync android
    scanignore:
      - android/capacitor-cordova-android-plugins
    # no ndk or extra tools are needed

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.2.0
CurrentVersionCode: 2
